<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a0f"><title>Ph.Live Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#090a0f;color:#f6f6f8;font:15px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:920px;margin:40px auto;padding:0 20px}.brand{display:flex;align-items:center;gap:14px;margin-bottom:28px}.mark{background:#000;border:1px solid #292c36;border-radius:14px;width:54px;height:54px;display:grid;place-items:center;font-size:18px;font-weight:900;letter-spacing:-1px}.ph{color:#1685ff}.live{color:#ed101d}.muted{color:#9a9eaa}.panel{background:#171922;border:1px solid #292c36;border-radius:18px;padding:22px;margin:16px 0}input,button{font:inherit;border-radius:10px;padding:13px;border:1px solid #373b48;background:#10121a;color:white;width:100%;margin:6px 0}input[type=checkbox]{width:auto;margin-right:8px;accent-color:#1685ff}button{background:#ed101d;border:0;font-weight:800;cursor:pointer}button:disabled{opacity:.6;cursor:wait}button.secondary{background:#292d38}button.danger{background:#6f1820}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.item{padding:14px 0;border-top:1px solid #333642}.hidden{display:none!important}h1{margin:0;font-size:22px}h2{margin-top:0}small{color:#9a9eaa}label{display:flex;align-items:center;margin:8px 0}.status{min-height:22px;white-space:pre-wrap}
@media(max-width:560px){.wrap{margin:22px auto}.panel{padding:17px}.row{align-items:stretch}.brand{margin-bottom:20px}}
</style>
</head>
<body><main class="wrap">
<div class="brand"><div class="mark"><span><span class="ph">Ph</span><span class="live">.Live</span></span></div><div><h1><span class="ph">Ph</span><span class="live">.Live</span> ADMIN</h1><small>PLAYLIST CONTROL CENTER</small></div></div>
<section id="login" class="panel"><h2>Administrator sign in</h2><input id="email" type="email" autocomplete="username" placeholder="Admin email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="signIn">SIGN IN</button><p id="loginMsg" class="muted status" role="status"></p></section>
<section id="admin" class="hidden">
<div class="panel"><div class="row"><div><h2>Upload playlist</h2><small>Upload an M3U file and choose whether to publish it.</small></div><button class="secondary" id="logout" style="max-width:130px">LOG OUT</button></div>
<input id="title" placeholder="Playlist title (e.g. Main playlist)"><input id="file" type="file" accept=".m3u,.m3u8,text/plain"><label><input id="publish" type="checkbox" checked> Publish immediately</label><button id="upload">UPLOAD &amp; SAVE</button><p id="uploadMsg" class="muted status" role="status"></p></div>
<div class="panel"><h2>Playlist library</h2><div id="list" class="muted">Loading…</div></div>
</section></main>
<script>
const SUPABASE_URL='https://zfxbhtwqlvpozprgqhnq.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmeGJodHdxbHZwb3pwcmdxaG5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MTg4MTMsImV4cCI6MjEwOTA5NDgxM30.nsEnz5AGaBT2BiOvwM0KYypxzN3Ie395SZKG3_IVRmE';
const STORAGE_BUCKET='vanta-playlists'; // Keep the existing Supabase bucket name; it is not user-facing branding.
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let session=null;const $=id=>document.getElementById(id);const msg=(id,t)=>$(id).textContent=t;
async function showAdmin(s){session=s;const {data:admin,error}=await sb.from('admin_users').select('user_id').eq('user_id',s.user.id).maybeSingle();if(error||!admin){await sb.auth.signOut();session=null;$('admin').classList.add('hidden');$('login').classList.remove('hidden');msg('loginMsg',error?error.message:'This account is not an administrator.');return false}$('login').classList.add('hidden');$('admin').classList.remove('hidden');msg('loginMsg','');await load();return true}
$('signIn').onclick=async()=>{const b=$('signIn');b.disabled=true;msg('loginMsg','Signing in…');const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)msg('loginMsg',error.message);else await showAdmin(data.session);b.disabled=false};
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('signIn').click()});
$('logout').onclick=async()=>{await sb.auth.signOut();session=null;location.reload()};
$('upload').onclick=async()=>{const b=$('upload'),file=$('file').files[0],title=$('title').value.trim();if(!file||!title){msg('uploadMsg','Choose an M3U file and enter a title.');return}if(!/\.m3u8?$/i.test(file.name)){msg('uploadMsg','Please upload an .m3u or .m3u8 file.');return}b.disabled=true;const path=crypto.randomUUID()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');msg('uploadMsg','Uploading…');const up=await sb.storage.from(STORAGE_BUCKET).upload(path,file,{contentType:'application/vnd.apple.mpegurl',upsert:false});if(up.error){msg('uploadMsg',up.error.message);b.disabled=false;return}const ins=await sb.from('playlists').insert({title,storage_path:path,is_published:$('publish').checked,uploaded_by:session.user.id});if(ins.error){await sb.storage.from(STORAGE_BUCKET).remove([path]);msg('uploadMsg',ins.error.message);b.disabled=false;return}msg('uploadMsg','Playlist uploaded successfully.');$('file').value='';$('title').value='';await load();b.disabled=false};
async function load(){const {data,error}=await sb.from('playlists').select('*').order('updated_at',{ascending:false});if(error){$('list').textContent=error.message;return}$('list').innerHTML='';for(const p of data){const el=document.createElement('div');el.className='item';const title=document.createElement('strong');title.textContent=p.title;const meta=document.createElement('div');meta.className='muted';meta.textContent=(p.is_published?'PUBLISHED':'DRAFT')+' · '+new Date(p.created_at).toLocaleString();const row=document.createElement('div');row.className='row';const toggle=document.createElement('button');toggle.className='secondary';toggle.textContent=p.is_published?'UNPUBLISH':'PUBLISH';toggle.onclick=async()=>{toggle.disabled=true;const r=await sb.from('playlists').update({is_published:!p.is_published,updated_at:new Date().toISOString()}).eq('id',p.id);if(r.error)alert(r.error.message);await load()};const del=document.createElement('button');del.className='danger';del.textContent='DELETE';del.onclick=async()=>{if(!confirm('Delete this playlist?'))return;const r=await sb.from('playlists').delete().eq('id',p.id);if(r.error){alert(r.error.message);return}await sb.storage.from(STORAGE_BUCKET).remove([p.storage_path]);await load()};row.append(toggle,del);el.append(title,meta,row);$('list').append(el)}if(!data.length)$('list').textContent='No playlists uploaded yet.'}
(async()=>{const {data:{session:s}}=await sb.auth.getSession();if(s)await showAdmin(s)})();
sb.auth.onAuthStateChange((_event,s)=>{if(!s){session=null;$('admin').classList.add('hidden');$('login').classList.remove('hidden')}});
</script></body></html>
